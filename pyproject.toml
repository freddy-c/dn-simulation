[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dn-simulation"
version = "0.1.0"
description = "A synchronous CONGEST and sleeping CONGEST simulator"
requires-python = ">=3.13"
dependencies = ["networkx>=3"]

[project.optional-dependencies]
visualization = ["matplotlib>=3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
